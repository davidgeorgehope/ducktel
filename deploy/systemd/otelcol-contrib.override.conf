# Drop-in for the otelcol-contrib package unit:
#   /etc/systemd/system/otelcol-contrib.service.d/ducktel.conf
[Unit]
After=ducktel-serve.service

[Service]
Slice=ducktel.slice
MemoryMax=256M
# DUCKTEL_AUTH_TOKEN only: the collector is an OTLP sender.
EnvironmentFile=/etc/ducktel/collector.env
# journald needs systemd-journal; filelog needs adm; docker_stats needs the
# docker socket (docker group is root-equivalent; drop it to skip containers).
SupplementaryGroups=systemd-journal adm docker
