# Drop-in for the otelcol-contrib package unit:
#   /etc/systemd/system/otelcol-contrib.service.d/ducktel.conf
[Unit]
After=ducktel-serve.service

[Service]
Slice=ducktel.slice
MemoryMax=256M
# DUCKTEL_AUTH_TOKEN only: the collector is an OTLP sender.
EnvironmentFile=/etc/ducktel/collector.env
# journald needs systemd-journal; file_log needs adm. No docker group: it is
# root-equivalent, so docker_stats is not collected.
SupplementaryGroups=systemd-journal adm
# Bound what the collector can push into the journal.
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200
