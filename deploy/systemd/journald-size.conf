# /etc/systemd/journald.conf.d/50-size.conf
# Hard bounds for the whole journal, so no unit (ducktel, the collector, or
# anything else) can grow it without limit. 4G matches what the default
# (10% of the filesystem, at most 4G) already allowed, so nothing old is
# vacuumed on install. SystemKeepFree stops journal growth while the root
# filesystem has less than 8G free.
[Journal]
SystemMaxUse=4G
SystemKeepFree=8G
SystemMaxFileSize=128M
