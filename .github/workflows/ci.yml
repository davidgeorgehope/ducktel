name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # go-duckdb is CGo and vendors a prebuilt libduckdb.a for linux/amd64,
      # so the runner needs a C toolchain but no download step.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # An explicit timeout, well under Go's 10m default: a deadlock (e.g. a
      # non-reentrant mutex locked twice) does not fail fast — it blocks until
      # the timeout, so the default would buy ten minutes of silence. The whole
      # suite runs in ~1.5s, so 2m is generous and still fails quickly.
      - name: Test
        run: go test -race -count=1 -timeout 2m ./...
